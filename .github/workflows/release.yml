name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # 1) 构建并打包 Web / PWA 静态资源
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Package web assets
        run: zip -r web.zip web

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: web.zip
          if-no-files-found: error

  # 2) 构建 Windows 桌面壳（exe + msi）
  build-tauri:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      # 使用官方 action 构建签名安装包并生成 latest.json，结果直接上传到本 tag 的 release
      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: ./src-tauri
          args: --target x86_64-pc-windows-msvc
          releaseName: ${{ github.ref_name }}
          tagName: ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false

      - name: Upload Tauri artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/*.zip
            src-tauri/target/release/bundle/*.sig
            src-tauri/target/release/sudoku.exe
          if-no-files-found: error

  # 3) 构建 Android Debug APK（如需发布签名版，请补充签名 secrets）
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install root dependencies
        run: npm install

      - name: Install app dependencies
        working-directory: ./app
        run: npm install

      - name: Add Android platform
        working-directory: ./app
        run: npm run cap:add:android

      # 先把仓库根目录的静态 PWA 资源同步到 app/www/（Capacitor 的 webDir），
      # 否则 npx cap sync 会报 “Could not find the web assets directory: ./www”
      - name: Sync web assets to www
        working-directory: ./app
        run: npm run sync

      - name: Sync web assets
        working-directory: ./app
        run: npx cap sync

      # 安装编译所需的 Android SDK platform 与 build-tools（compileSdk = 36）
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: ./app/android
        run: ./gradlew assembleDebug

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # 4) 汇总 artifacts 并创建 GitHub Release
  release:
    needs: [build-web, build-tauri, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract release notes
        id: notes
        run: |
          NOTES=$(node tools/extract-release-notes.mjs "${GITHUB_REF_NAME}")
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.body }}
          files: |
            artifacts/web/web.zip
            artifacts/tauri-windows/*
            artifacts/android-debug/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
