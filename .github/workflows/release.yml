name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # 1) 构建并打包 Web / PWA 静态资源
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Package web assets
        run: zip -r web.zip web

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: web.zip
          if-no-files-found: error

  # 1.5) 提前创建 GitHub Release（供 Tauri 上传 latest.json/签名，避免 tauri-action 自行创建导致的权限冲突）
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Extract release notes
        id: notes
        run: node tools/extract-release-notes.mjs "${GITHUB_REF_NAME}" > /tmp/notes.md

      - name: Create GitHub Release
        id: create
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md \
            --repo "$GITHUB_REPOSITORY"
          REL_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq .id)
          echo "release_id=$REL_ID" >> "$GITHUB_OUTPUT"

  # 2) 构建 Windows 桌面壳（exe + msi）
  build-tauri:
    needs: [prepare-release]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      # 构建签名安装包并生成 latest.json，产物（exe/.sig/latest.json）上传到 prepare-release 已创建的 Release
      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: ./src-tauri
          args: --target x86_64-pc-windows-msvc
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}

      - name: Upload Tauri artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/*.zip
            src-tauri/target/release/bundle/*.sig
            src-tauri/target/release/sudoku.exe
          if-no-files-found: error

  # 3) 构建 Android Debug APK（如需发布签名版，请补充签名 secrets）
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install root dependencies
        run: npm install

      - name: Install app dependencies
        working-directory: ./app
        run: npm install

      - name: Add Android platform
        working-directory: ./app
        run: npm run cap:add:android

      # 先把仓库根目录的静态 PWA 资源同步到 app/www/（Capacitor 的 webDir），
      # 否则 npx cap sync 会报 “Could not find the web assets directory: ./www”
      - name: Sync web assets to www
        working-directory: ./app
        run: npm run sync

      - name: Sync web assets
        working-directory: ./app
        run: npx cap sync

      # 安装编译所需的 Android SDK platform 与 build-tools（compileSdk = 36）
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: ./app/android
        run: ./gradlew assembleDebug

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # 4) 汇总 artifacts 并补充上传到已创建的 GitHub Release
  release:
    needs: [build-web, build-tauri, build-android, prepare-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload web & android assets to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find artifacts/android-debug -name '*.apk' | head -1)
          gh release upload "$GITHUB_REF_NAME" \
            artifacts/web/web.zip \
            "$APK" \
            --repo "$GITHUB_REPOSITORY"
